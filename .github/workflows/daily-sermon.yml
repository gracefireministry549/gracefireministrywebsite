name: Publish Daily Sermon

on:
  schedule:
    # 06:00 in Nigeria (Africa/Lagos, UTC+1) = 05:00 UTC
    - cron: '0 5 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-sermon-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out website
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Generate today's sermon
        run: node scripts/generate-daily-sermon.js
      - name: Publish sermon data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/sermons/daily-sermon.json
          if git diff --cached --quiet; then
            echo "No sermon changes to publish."
            exit 0
          fi
          git commit -m "Publish daily sermon"
          git push
